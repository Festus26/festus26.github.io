<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game of Life</title>
    <meta name="description" content="Conway's Game of Life written in C with raylib, compiled to WebAssembly.">

    <style>
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0f1624;
        font-family: 'Poppins', system-ui, sans-serif;
        color: #cbd5e0;
      }

      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* NOTE: Canvas *must not* have any border or padding, or mouse coords will be wrong.
         The canvas is 800x840 (board + status bar), so scale it to the largest size that fits. */
      #canvas {
        display: block;
        border: 0 none;
        padding: 0;
        background: #000;
        width: min(100vw, 100vh * 800 / 840);
        aspect-ratio: 800 / 840;
        outline: none;
      }

      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0f1624;
        transition: opacity .4s ease;
        pointer-events: none;
      }
      #overlay.hidden { opacity: 0; }

      .spinner {
        width: 36px;
        height: 36px;
        border: 4px solid rgba(255, 255, 255, .15);
        border-top-color: #ff7b00;
        border-radius: 50%;
        animation: rotation .8s linear infinite;
      }
      @keyframes rotation { to { transform: rotate(360deg); } }

      #focus-hint {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(0, 0, 0, .7);
        font-size: 13px;
        pointer-events: none;
        transition: opacity .3s ease;
      }
      #focus-hint.hidden { opacity: 0; }

      #btn-fullscreen {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 36px;
        height: 36px;
        border: 1px solid rgba(255, 255, 255, .2);
        border-radius: 8px;
        background: rgba(0, 0, 0, .55);
        color: #fff;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        opacity: .6;
        transition: opacity .2s ease, border-color .2s ease;
      }
      #btn-fullscreen:hover, #btn-fullscreen:focus-visible { opacity: 1; border-color: #ff7b00; }

      @media (prefers-reduced-motion: reduce) {
        .spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0" aria-label="Game of Life board"></canvas>

      <div id="overlay">
        <div class="spinner" id="spinner"></div>
        <div id="status">Loading…</div>
      </div>

      <div id="focus-hint" class="hidden">Click the board to interact</div>
      <button id="btn-fullscreen" type="button" title="Fullscreen" aria-label="Fullscreen" hidden>⛶</button>
    </div>

    <script type="text/javascript">
        // raylib calls this from C when saving files (e.g. TakeScreenshot)
        function saveFileFromMEMFSToDisk(memoryFSname, localFSname)
        {
            var data = FS.readFile(memoryFSname);
            var url = URL.createObjectURL(new Blob([data.buffer], { type: "application/octet-binary" }));
            var link = document.createElement('a');
            link.href = url;
            link.download = localFSname;
            link.click();
            setTimeout(function() { URL.revokeObjectURL(url); }, 0);
        }
    </script>
    <script type="text/javascript">
        var canvasElement = document.querySelector('#canvas');
        var overlayElement = document.querySelector('#overlay');
        var statusElement = document.querySelector('#status');
        var spinnerElement = document.querySelector('#spinner');
        var hintElement = document.querySelector('#focus-hint');
        var fullscreenButton = document.querySelector('#btn-fullscreen');

        function showError(text) {
            statusElement.textContent = text;
            spinnerElement.style.display = 'none';
            overlayElement.classList.remove('hidden');
        }

        var Module = {
            print: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
            },
            printErr: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
            },
            canvas: (function() {
                canvasElement.addEventListener("webglcontextlost", function(e) {
                    e.preventDefault();
                    showError('Graphics context lost. Reload the page to restart.');
                }, false);
                return canvasElement;
            })(),
            setStatus: function(text) {
                if (!text) return;
                // Strip emscripten's "(x/y)" progress suffix
                statusElement.textContent = text.replace(/\s*\(\d+(\.\d+)?\/\d+\)\s*$/, '');
            },
            onRuntimeInitialized: function() {
                overlayElement.classList.add('hidden');
                fullscreenButton.hidden = false;
                setTimeout(updateRendering, 0); // the main loop starts after this callback
                if (document.activeElement !== canvasElement) hintElement.classList.remove('hidden');
            }
        };

        // Keyboard input only reaches the game while this frame has focus
        // preventScroll: focusing would otherwise scroll the parent page mid-click and move the board under the cursor
        canvasElement.addEventListener('pointerdown', function() { canvasElement.focus({ preventScroll: true }); });
        canvasElement.addEventListener('focus', function() { hintElement.classList.add('hidden'); });
        canvasElement.addEventListener('blur', function() {
            if (overlayElement.classList.contains('hidden')) hintElement.classList.remove('hidden');
        });

        fullscreenButton.addEventListener('click', function() {
            Module.requestFullscreen(false, false);
        });

        // GLFW swallows wheel events on the canvas; the game doesn't use the wheel,
        // so stop them here and let the portfolio page scroll normally
        window.addEventListener('wheel', function(e) { e.stopPropagation(); }, true);

        // Stop drawing while the board is scrolled out of view (or its tab is hidden)
        var boardVisible = true;
        function updateRendering() {
            if (!Module._PauseRendering) return;
            if (boardVisible && !document.hidden) Module._ResumeRendering();
            else Module._PauseRendering();
        }
        new IntersectionObserver(function(entries) {
            boardVisible = entries[entries.length - 1].isIntersecting;
            updateRendering();
        }).observe(canvasElement);
        document.addEventListener('visibilitychange', updateRendering);

        window.onerror = function() {
            showError('Something went wrong. See the browser console for details.');
            Module.setStatus = function(text) { if (text) Module.printErr('[post-exception status] ' + text); };
        };
    </script>
    <script type="text/javascript">
        // Reuse this page's ?v= cache-busting version for the JS/wasm pair so they always match
        var version = new URLSearchParams(location.search).get('v');
        var versionSuffix = version ? '?v=' + encodeURIComponent(version) : '';
        Module.locateFile = function(path, prefix) { return prefix + path + versionSuffix; };

        var gameScript = document.createElement('script');
        gameScript.src = 'game_of_life.js' + versionSuffix;
        gameScript.async = true;
        document.body.appendChild(gameScript);
    </script>
  </body>
</html>
