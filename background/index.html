<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Animation Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            width: 100vw;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Optional: Add info overlay */
        .info-overlay {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 10;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 123, 0, 0.3);
        }

        .info-overlay h3 {
            color: #ff7b00;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .info-overlay p {
            margin: 3px 0;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <canvas id="space-canvas"></canvas>
    
    <!-- Optional info overlay - remove if you don't want it -->
    <div class="info-overlay">
        <h3>🌌 Space Animation</h3>
        <p>Created by Festus26</p>
    </div>

    <script src="space-animation.js"></script>
</body>
</html>
